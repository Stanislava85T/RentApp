<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
<title>Наем и Имоти / Rent & Properties</title>

<!-- Икона на приложението (favicon за таб на браузъра / desktop) -->
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2A3A">


<!-- Библиотеки (React + Babel, за да работи JSX директно в браузъра) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Шрифтове: Google Fonts е блокиран в preview панела тук, затова разчитаме на системните шрифтове
     (Poppins/Inter в CSS-а автоматично се falls back към обикновен sans-serif, ако не са налични) -->

<!-- ==================================================================
     СТИЛОВЕ — всичко е тук, подредено по секции с коментари.
     Търси коментар от вида "/* ---------- N. ИМЕ ---------- */"
     за раздела, който искаш да промениш (цветове, отстъпи, размери).
     ================================================================== -->
<style>
/* ============================================================
   НАЕМ И ИМОТИ — СТИЛОВЕ
   Подредено по секции. Всички разстояния, размери и цветове
   са истински CSS стойности — търси по коментарите отдолу.
   ============================================================ */

/* ---------- 1. ПРОМЕНЛИВИ (цветове, шрифтове, отстъпи) ---------- */
:root {
  /* Цветове */
  --color-bg: #E7F5EF;          /* фон на страницата (мента) */
  --color-card: #FFFFFF;        /* бял фон на картички/модали */
  --color-ink: #1E2A3A;         /* основен текст (тъмно) */
  --color-slate: #8A93A6;       /* второстепенен текст (сиво) */
  --color-accent: #5B4FE0;      /* индиго — основен акцент */
  --color-accent-light: #ECE9FC;
  --color-success: #1E9E5A;
  --color-success-bg: #DDF6E7;
  --color-warning: #E0821E;
  --color-warning-bg: #FCEEDA;
  --color-danger: #DE5347;
  --color-danger-bg: #FBE7E4;
  --color-border: #EEF1F0;
  --color-header-bg: #1E2A3A;   /* тъмен фон на горната лента */
  --color-input-muted: #F5F7F6;
  --color-chip-muted: #F1F1EF;

  /* Шрифтове */
  --font-display: 'Inter', sans-serif;    /* заглавия / числа — вградена локално, виж @font-face по-долу */
  --font-body: 'Inter', sans-serif;       /* обикновен текст — вградена локално, виж @font-face по-долу */

  /* Радиуси на скръгляне */
  --radius-sm: 0.5rem;
  --radius-md: 0.75rem;
  --radius-lg: 1rem;
  --radius-xl: 1.5rem;
  --radius-full: 999px;

  /* Отстъпи (padding / margin / gap) — променяй тук на едно място */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;

  /* Ширина на съдържанието */
  --content-max-width: 72rem;   /* 1152px */
  --sidebar-width: 17.5rem;     /* 280px */
}

/* ---------- 2. БАЗА / RESET ---------- */

/* Локални шрифтове (Inter) — файловете седят в папка /fonts до този HTML.
   Работят офлайн, без връзка към Google Fonts. За всяко тегло има отделен
   файл за латиница и отделен за кирилица (по-малки файлове, по-бързо зареждане). */
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/inter-cyrillic-400-normal.woff2') format('woff2');
  unicode-range: U+0400-045F, U+0460-052F, U+1C80-1C88, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/inter-latin-400-normal.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url('fonts/inter-cyrillic-500-normal.woff2') format('woff2');
  unicode-range: U+0400-045F, U+0460-052F, U+1C80-1C88, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url('fonts/inter-latin-500-normal.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url('fonts/inter-cyrillic-600-normal.woff2') format('woff2');
  unicode-range: U+0400-045F, U+0460-052F, U+1C80-1C88, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url('fonts/inter-latin-600-normal.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url('fonts/inter-cyrillic-700-normal.woff2') format('woff2');
  unicode-range: U+0400-045F, U+0460-052F, U+1C80-1C88, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url('fonts/inter-latin-700-normal.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;   /* страницата никога не се измества настрани */
}
html {
  overflow-y: scroll;         /* винаги резервира мястото на вертикалния скролбар... */
  scrollbar-gutter: stable;   /* ...по модерния начин, ако браузърът го поддържа */
}
body {
  background: var(--color-bg);
  font-family: var(--font-body);
  color: var(--color-ink);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { display: block; }

/* ---------- 3. ОБЩ КОНТЕЙНЕР ---------- */
.container {
  max-width: var(--content-max-width);
  margin: 0 auto;
  padding: var(--space-4) var(--space-6);
}

/* ---------- 4. ГОРНА ЛЕНТА (TOPBAR) ---------- */
.topbar {
  background: var(--color-header-bg);
  width: 100%;
}
.topbar-inner {
  max-width: var(--content-max-width);
  margin: 0 auto;
  padding: var(--space-4) var(--space-6);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}
.brand {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  min-width: 0; /* позволява truncate на заглавието */
}
.brand-btn {
  border: none;
  background: none;
  padding: 0;
  text-align: left;
  cursor: pointer;
  border-radius: var(--radius-md);
}
.brand-btn:hover .brand-icon { background: #6E62E8; }
.brand-icon {
  width: 2.5rem;
  height: 2.5rem;
  border-radius: var(--radius-md);
  background: var(--color-accent);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex-shrink: 0;
}
.brand-text { min-width: 0; }
.brand-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.08rem;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-subtitle {
  font-size: 0.72rem;
  color: #9AA5B5;
  line-height: 1.25;
}

.profile-btn {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 0.375rem 0.875rem 0.375rem 0.5rem;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,0.1);
  border: none;
  flex-shrink: 0;
}
.profile-avatar {
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-full);
  background: var(--color-accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  flex-shrink: 0;
}
.profile-name {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.84rem;
  color: #fff;
  max-width: 6.25rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- 5. ОСНОВНА РЕШЕТКА (SIDEBAR + DETAIL) ---------- */
.layout-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);   /* същата защита като при .tabs — колоната вече не може да се разтегне заради широко съдържание вътре (напр. ред в таблицата с плащания) */
  gap: var(--space-5);
}
.welcome-block-mobile { margin-top: var(--space-4); }
@media (min-width: 768px) {
  .welcome-block-mobile { display: none; }   /* на десктоп същият блок вече се показва в дясната колона */
}
@media (min-width: 768px) {
  .layout-grid { grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
}
.grid-col { min-width: 0; }   /* всяка от двете колони (списък / детайли) също не отказва да се свие */

/* Скрива sidebar или detail панела на мобилен изглед, докато
   не е избран съответният таб (управлява се от JS state) */
@media (max-width: 767px) {
  .hide-on-mobile { display: none; }
}

.back-link {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  margin-bottom: var(--space-3);
  font-size: 0.875rem;
  color: var(--color-slate);
  background: none;
  border: none;
}
@media (min-width: 768px) {
  .back-link { display: none; }
}

/* ---------- 6. БУТОНИ (общи) ---------- */
.btn {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.875rem;
  border: none;
  border-radius: var(--radius-full);
  padding: 0.625rem 1rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.375rem;
}
.btn-primary   { background: var(--color-accent); color: #fff; }
.btn-secondary { background: var(--color-accent-light); color: var(--color-accent); }
.btn-muted     { background: var(--color-chip-muted); color: var(--color-slate); }
.btn-danger    { background: var(--color-danger); color: #fff; }
.btn-danger-soft { background: var(--color-danger-bg); color: var(--color-danger); }
.btn-block { width: 100%; }
.btn-full-in-form { flex: 1; padding: 0.75rem 1rem; border-radius: var(--radius-md); }

.btn-icon-round {
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: var(--color-chip-muted);
  flex-shrink: 0;
}
.btn-icon-round.danger { background: var(--color-danger-bg); color: var(--color-danger); }

.btn-new-property {
  width: 100%;
  margin-bottom: var(--space-3);
  padding: 0.625rem 0.75rem;
  border-radius: var(--radius-lg);
  background: var(--color-accent-light);
  color: var(--color-accent);
  font-weight: 500;
}

/* Малки "чипове" за избор на тип сметка / език / аватар */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.375rem 0.625rem;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  font-weight: 600;
  border: none;
  background: var(--color-accent-light);
  color: var(--color-accent);
}
.chip.active { background: var(--color-accent); color: #fff; }

/* ---------- 7. КАРТИЧКА НА ИМОТ (в sidebar списъка) ---------- */
.property-card {
  width: 100%;
  text-align: left;
  border: none;
  border-radius: var(--radius-lg);
  padding: 0.875rem;
  margin-bottom: 0.625rem;
  background: var(--color-card);
  box-shadow: 0 1px 2px rgba(20,30,40,0.05);
}
.property-card.active { box-shadow: 0 0 0 2px var(--color-accent); }
.property-card-row { display: flex; align-items: center; gap: var(--space-3); }
.property-icon {
  width: 2.5rem;
  height: 2.5rem;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: var(--color-accent-light);
  color: var(--color-accent);
}
.property-card.active .property-icon { background: var(--color-accent); color: #fff; }
.property-info { min-width: 0; flex: 1; }
.property-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.94rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.property-tenant {
  font-size: 0.75rem;
  color: var(--color-slate);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.status-dot {
  width: 0.625rem;
  height: 0.625rem;
  border-radius: var(--radius-full);
  flex-shrink: 0;
  background: var(--color-warning);
}
.property-rent-wrap { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
.property-rent { font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; }
.status-ok { color: var(--color-success); flex-shrink: 0; }

.empty-hint { font-size: 0.875rem; color: var(--color-slate); padding: var(--space-3); }

/* ---------- 8. ЗАГЛАВИЕ НА ИМОТ + ТАБОВЕ ---------- */
.detail-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.5rem;
}
.detail-address { font-size: 0.8125rem; color: var(--color-slate); }
.detail-heading { margin-bottom: var(--space-4); }

.tabs {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));  /* minmax(0,..) принуждава клетките да се свиват, а не да бутат решетката извън екрана */
  gap: 0.5rem;
  margin-bottom: var(--space-4);
}
@media (min-width: 640px) {
  .tabs {
    display: flex;                        /* на по-широк екран — един ред без пренасяне */
    flex-wrap: wrap;
    gap: 0.375rem;
  }
}
.tab-btn {
  display: flex;
  flex-direction: column;    /* икона над текста на телефон — думата получава цялата ширина на бутона */
  align-items: center;
  justify-content: center;
  gap: 0.2rem;
  width: 100%;
  height: 100%;
  padding: 0.5rem 0.25rem;
  border-radius: var(--radius-lg);
  font-size: 0.72rem;
  font-weight: 600;
  line-height: 1.15;
  text-align: center;
  border: none;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;  /* маха стандартния "флаш" ефект на браузъра при допир, който може да изглежда като промяна на размера */
  background: var(--color-card);
  color: var(--color-slate);
  overflow: hidden;
  box-sizing: border-box;
}
.tab-btn:focus { outline: none; }
.tab-btn-icon { flex-shrink: 0; }
.tab-btn-label { min-width: 0; overflow-wrap: break-word; word-break: break-word; }
@media (min-width: 640px) {
  .tab-btn {
    flex-direction: row;     /* на широк екран — икона и текст на един ред, както преди */
    width: auto;              /* НЕ запълва целия ред тук — иначе всеки бутон пада на собствен ред */
    height: auto;
    gap: 0.375rem;
    padding: 0.5rem 0.875rem;
    font-size: 0.875rem;
    border-radius: var(--radius-full);
    white-space: nowrap;
  }
}
.tab-btn.active { background: var(--color-accent); color: #fff; }

/* ---------- 9. ПАНЕЛИ / КАРТИЧКИ СЪС СЪДЪРЖАНИЕ ---------- */
.panel-card {
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  background: var(--color-card);
  box-shadow: 0 1px 2px rgba(20,30,40,0.05);
}
.panel-card + .panel-card { margin-top: var(--space-4); }
.panel-card.tight { padding: var(--space-4); }
.panel-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.9rem;
  margin-bottom: var(--space-3);
}

/* ---------- 10. ФОРМИ / ПОЛЕТА ЗА ВЪВЕЖДАНЕ ---------- */
.field { display: block; margin-bottom: var(--space-3); }
@media (min-width: 640px) {
  .field { margin-bottom: 0.625rem; }
}
.field-label {
  font-size: 0.75rem;
  margin-bottom: 0.25rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--color-slate);
}
.input {
  width: 100%;
  border-radius: var(--radius-md);
  padding: 0.75rem 0.875rem;
  font-size: 0.875rem;
  border: 1px solid var(--color-border);
  outline: none;
  background: #fff;
}
.input:focus { border-color: var(--color-accent); }
.input.muted-bg { background: var(--color-input-muted); }
.input.on-tint { background: #fff; }
textarea.input { font-size: 0.78rem; line-height: 1.5; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr;
  column-gap: var(--space-4);
}
@media (min-width: 640px) {
  .form-grid.cols-2 { grid-template-columns: 1fr 1fr; }
  .form-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .form-grid.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
}
.form-grid .span-all { grid-column: 1 / -1; }
.form-grid.tight-gap { gap: var(--space-2); margin-bottom: var(--space-3); }

.form-actions { display: flex; gap: var(--space-3); margin-top: var(--space-2); }

/* ---------- 11. МОДАЛ (Нов имот / Редакция / Профил) ---------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;   /* плавно скролиране на телефон, включително при увеличен текст/zoom */
  background: rgba(20,26,36,0.45);
  backdrop-filter: blur(4px);
}
.modal-align {
  min-height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0 0 var(--space-4);   /* малко отстояние отдолу — картичката вече не е залепена за ръба */
}
@media (min-width: 640px) {
  .modal-align { align-items: center; padding: var(--space-4) 0; }
}
.modal {
  width: 100%;
  max-height: 82vh;           /* модалът вече не расте безкрайно — полетата скролват вътрешно */
  display: flex;
  flex-direction: column;
  background: var(--color-card);
  border-radius: var(--radius-xl);   /* напълно заоблени ъгли и на телефон, вместо само горе */
}
@media (min-width: 640px) {
  .modal { max-width: 32rem; max-height: 94vh; border-radius: var(--radius-xl); margin: var(--space-4) 0; }
  .modal.modal-wide { max-width: 38rem; }   /* "Профил" е по-широк на десктоп — аватарите се събират на 1 ред, по-малко скролиране */
}
.modal-header {

  border-radius: var(--radius-lg);

  position: fixed;
  bottom: var(--space-4);
  right: var(--space-4);
  padding: 0.5rem 0.75rem;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  background: var(--color-danger);
  color: #fff;

.text-muted { color: var(--color-slate); }

const LangContext = createContext("bg");
const useLang = () => useContext(LangContext);
const useT = () => STR[useLang()];

const AVATAR_OPTIONS = ["🏠", "🔑", "🏢", "🧑", "🏙️", "🗝️", "📋", "🌇"];

const uid = () => Math.random().toString(36).slice(2, 10);
const fmt = (n) => `€ ${(Number(n) || 0).toLocaleString("bg-BG", { maximumFractionDigits: 2 })}`;
const monthLabel = (ym, lang) => {
  const [y, m] = ym.split("-");
  const names = STR[lang || "bg"].months;
  return `${names[parseInt(m, 10) - 1]} ${y}`;
};
const todayYM = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
};
const addMonths = (ym, n) => {
  const [y, m] = ym.split("-").map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
};
const fmtDate = (iso) => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  if (!y || !m || !d) return iso;
  return `${d}/${m}/${y}`;   /* показва дата/месец/година вместо суровия ISO формат (год-мес-ден) */
};

function generatePayments(property) {
  if (!property.contractStart) return [];
  const [sy, sm, sd] = property.contractStart.split("-").map(Number);
  let endDate;
  if (property.contractEnd) {
    const [ey, em, ed] = property.contractEnd.split("-").map(Number);
    endDate = new Date(ey, em - 1, ed);
  } else {
    endDate = new Date(sy, sm - 1 + 6, sd); // без зададен край: генерира ~6 периода напред
  }
  const pad2 = (n) => String(n).padStart(2, "0");
  const toISO = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const payments = [];
  let cy = sy, cm = sm; // година/месец на текущия период; денят на всеки период е винаги sd (денят на започване на договора)
  let guard = 0;
  while (guard < 240) {
    const periodStart = new Date(cy, cm - 1, sd);
    if (periodStart > endDate) break; // следващият период започва след края на договора — спира тук, вместо да брои по цели календарни месеци
    let nextCy = cy, nextCm = cm + 1;
    if (nextCm > 12) { nextCm = 1; nextCy += 1; }
    const nextPeriodStart = new Date(nextCy, nextCm - 1, sd);
    const periodEnd = new Date(nextPeriodStart); periodEnd.setDate(periodEnd.getDate() - 1); // ден преди старта на следващия период
    const cappedPeriodEnd = periodEnd < endDate ? periodEnd : endDate; // не показва край след реалния край на договора
    const monthStr = `${cy}-${pad2(cm)}`;
    payments.push({
      id: uid(), month: monthStr,
      periodStart: toISO(periodStart), periodEnd: toISO(cappedPeriodEnd),
      dueDate: `${cy}-${pad2(cm)}-${String(property.paymentDay || 5).padStart(2, "0")}`,
      amount: property.rent || 0, paid: false, paidDate: null, note: "",
    });
    cy = nextCy; cm = nextCm;
    guard++;
  }
  return payments;
}

  const payments = property.payments || [];
  const upcoming = payments.find((p) => !p.paid && p.month >= todayYM());
  const visible = paidFilter === "unpaid" ? payments.filter((p) => !p.paid) : payments;
  const editingPayment = payments.find((p) => p.id === editingId);

  return (

      <div style={{ display: "flex", flexDirection: "column", gap: "0.75rem" }}>
        {visible.map((p) => (
          <div key={p.id} className={"payment-card" + (p.paid ? " paid" : "")}>
            <div className="payment-card-top">
              <div>
                <div className="payment-card-month">{monthLabel(p.month, lang)}</div>
                {p.periodStart && p.periodEnd && (
                  <div className="payment-card-period">{fmtDate(p.periodStart)} – {fmtDate(p.periodEnd)}</div>
                )}
                <div className="payment-card-due">{t.dueDateLabel} {fmtDate(p.dueDate)}</div>
                {p.note ? <div className="payment-card-note">{p.note}</div> : null}
              </div>
              <div className="payment-card-right">
                <div className="payment-card-amount">{fmt(p.amount)}</div>
                <span className={"badge " + (p.paid ? "badge-success" : "badge-muted")}>{p.paid ? t.paidLabel : t.paymentUnpaidLabel}</span>
              </div>
            </div>
            <div className="payment-card-actions">
              <button onClick={() => onTogglePaid(p.id)} className={"payment-icon-btn" + (p.paid ? " active" : "")} title={t.markPaidBtn}>
                <Check size={16} />
              </button>
              <button onClick={() => setEditingId(p.id)} className="payment-icon-btn" title={t.editBtn}>
                <Pencil size={16} />
              </button>
            </div>
          </div>
        ))}
        {visible.length === 0 && <div className="empty-hint">{t.noPaymentsSchedule}</div>}
      </div>

      {editingPayment && (
        <PaymentEditModal
          payment={editingPayment}
          lang={lang}
          onCancel={() => setEditingId(null)}
          onSave={(patch) => { onUpdatePayment(editingPayment.id, patch); setEditingId(null); }}
        />
      )}
    </div>
  );
}

function BillsTab({ property, onAddBill, onToggleBillPaid, onUpdateBill, onDeleteBill }) {
  const t = useT();
  const lang = useLang();
  const BILL_TYPES = BILL_TYPES_FOR(t);
  const [type, setType] = useState("elec");
  const [amount, setAmount] = useState("");
  const [reading, setReading] = useState("");
  const [otherDesc, setOtherDesc] = useState("");
  const [note, setNote] = useState("");
  const [month, setMonth] = useState(todayYM());
  const [filterMonth, setFilterMonth] = useState("all");
  const [editingId, setEditingId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const bills = property.bills || [];

  const submit = () => {
    if (!amount) return;
    onAddBill({ id: uid(), type, amount: Number(amount), meterReading: reading, otherDesc, note, month, paid: false, date: new Date().toISOString().slice(0, 10) });
    setAmount(""); setReading(""); setOtherDesc(""); setNote("");
  };

  const availableMonths = Array.from(new Set(bills.map((b) => b.month || todayYM()))).sort().reverse();
  const visibleBills = (filterMonth === "all" ? bills : bills.filter((b) => (b.month || todayYM()) === filterMonth))
    .slice().sort((a, b) => (b.month || "").localeCompare(a.month || "") || (b.date || "").localeCompare(a.date || ""));

  return (
    <div>
      <div className="panel-card tight">
        <div className="panel-title">{t.newBillTitle}</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: "0.375rem", marginBottom: "0.75rem" }}>
          {BILL_TYPES.map((bt) => (
            <button key={bt.key} onClick={() => setType(bt.key)} className={"chip" + (type === bt.key ? " active" : "")}>
              <bt.icon size={12} /> {bt.label}
            </button>
          ))}
        </div>
        <div className="form-grid cols-4">
          <Field label={t.fieldPeriod}><input type="month" className="input" value={month} onChange={(e) => setMonth(e.target.value)} /></Field>
          <Field label={t.fieldAmount}><input type="number" className="input" value={amount} onChange={(e) => setAmount(e.target.value)} /></Field>
          {type === "other" ? (
            <Field label={t.fieldOtherDesc}><input className="input" value={otherDesc} onChange={(e) => setOtherDesc(e.target.value)} placeholder={t.placeholderOtherDesc} /></Field>
          ) : (
            <Field label={t.fieldReading}><input className="input" value={reading} onChange={(e) => setReading(e.target.value)} placeholder={t.placeholderReading} /></Field>
          )}
          <Field label={t.fieldNote}><input className="input" value={note} onChange={(e) => setNote(e.target.value)} /></Field>
        </div>
        <button onClick={submit} className="btn btn-primary">{t.addBtn}</button>
      </div>

      {availableMonths.length > 0 && (
        <div className="filter-row">
          <span className="filter-label">{t.periodLabel}</span>
          <select value={filterMonth} onChange={(e) => setFilterMonth(e.target.value)} className="select">
            <option value="all">{t.allMonths}</option>
            {availableMonths.map((m) => (<option key={m} value={m}>{monthLabel(m, lang)}</option>))}
          </select>
        </div>
      )}

      <div className="list-card">
        {visibleBills.map((b) => {
          const meta = BILL_TYPES.find((bt) => bt.key === b.type) || BILL_TYPES[0];
          if (editingId === b.id) {
            return <BillEditRow key={b.id} bill={b} onCancel={() => setEditingId(null)} onSave={(patch) => { onUpdateBill(b.id, patch); setEditingId(null); }} />;
          }
          return (
            <div key={b.id} className="list-row">
              <div className="list-row-main">
                <div className="list-row-icon"><meta.icon size={14} /></div>
                <div className="list-row-text">
                  <div className="list-row-title">{b.type === "other" && b.otherDesc ? b.otherDesc : meta.label} · {monthLabel(b.month || todayYM(), lang)} {b.meterReading && `· ${b.meterReading}`}</div>
                  <div className="list-row-sub">{b.note ? b.note : t.addedOn(fmtDate(b.date))}</div>
                </div>
              </div>
              <div className="list-row-actions">
                <span className="list-row-amount">{fmt(b.amount)}</span>
                <button onClick={() => onToggleBillPaid(b.id)} className={"badge " + (b.paid ? "badge-success" : "badge-warning")}>
                  {b.paid ? t.billPaidLabel : t.billUnpaidLabel}
                </button>
                <button onClick={() => setEditingId(b.id)} className="btn-icon-round"><Pencil size={12} className="icon-slate" /></button>
                {confirmDeleteId === b.id ? (
                  <button onClick={() => { onDeleteBill(b.id); setConfirmDeleteId(null); }} className="badge" style={{ background: "var(--color-danger)", color: "#fff" }}>{t.confirmYesDelete}</button>
                ) : (
                  <button onClick={() => setConfirmDeleteId(b.id)} className="btn-icon-round danger"><Trash2 size={12} /></button>
                )}
              </div>
            </div>
          );
        })}
        {visibleBills.length === 0 && <div className="empty-hint">{t.noBillsForPeriod}</div>}
      </div>
    </div>
  );
}

/* ============================================================
   ГЛАВНО ПРИЛОЖЕНИЕ
   ============================================================ */
function AppInner() {
  const [properties, setProperties] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [tab, setTab] = useState("overview");
  const [showNew, setShowNew] = useState(false);
  const [editing, setEditing] = useState(false);
  const [showProfile, setShowProfile] = useState(false);
  const [profile, setProfile] = useState({ name: "", avatar: "🏠" });
  const [mobileView, setMobileView] = useState("list");
  const [saveError, setSaveError] = useState(false);
  const lang = useLang();
  const t = useT();

  // --- Поддръжка на бутона/жеста "назад" на телефона ---
  // Вместо да излиза от приложението, back затваря текущия отворен слой
  // (модал → детайли на имот → списък), по един слой на натискане.
  const pushNavState = (label) => {
    try { window.history.pushState({ appNav: label }, ""); } catch (e) {}
  };
  const goBack = () => {
    try { window.history.back(); } catch (e) {}
  };
  useEffect(() => {
    try { window.history.replaceState({ appNav: "root" }, ""); } catch (e) {}
    const onPopState = () => {
      setShowProfile((sp) => {
        if (sp) return false;
        setEditing((ed) => {
          if (ed) return false;
          setShowNew((sn) => {
            if (sn) return false;
            setMobileView((mv) => (mv === "detail" ? "list" : mv));
            return false;
          });
          return ed;
        });
        return sp;
      });
    };
    window.addEventListener("popstate", onPopState);
    return () => window.removeEventListener("popstate", onPopState);
  }, []);

  useEffect(() => {
    try {
      const raw = localStorage.getItem("rental-manager-properties");
      if (raw) {
        const parsed = JSON.parse(raw);
        setProperties(parsed);
        // не избира автоматично първия имот — на десктоп потребителят вижда приветствен екран, докато сам не избере
      }
    } catch (e) {}
    try {
      const rawProfile = localStorage.getItem("rental-manager-profile");
      if (rawProfile) setProfile(JSON.parse(rawProfile));
    } catch (e) {} finally {
      setLoaded(true);
    }
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem("rental-manager-properties", JSON.stringify(properties));
      setSaveError(false);
    } catch (e) { setSaveError(true); }
  }, [properties, loaded]);

  useEffect(() => {
    if (!loaded) return;
    try { localStorage.setItem("rental-manager-profile", JSON.stringify(profile)); } catch (e) {}
  }, [profile, loaded]);

  const selected = properties.find((p) => p.id === selectedId);

  const updateProperty = (id, patch) => setProperties((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));

  const addProperty = (form) => {
    const base = { id: uid(), ...form, rent: Number(form.rent) || 0, deposit: Number(form.deposit) || 0, paymentDay: Number(form.paymentDay) || 5, bills: [], maintenance: [] };
    base.payments = generatePayments(base);
    setProperties((prev) => [...prev, base]);
    setSelectedId(base.id);
    setShowNew(false);
    setMobileView("detail");
    setTab("overview");
  };

  const editProperty = (form) => {
    if (!selected) return;
    const newRent = Number(form.rent) || 0;
    const newPaymentDay = Number(form.paymentDay) || 5;
    const rentChanged = newRent !== Number(selected.rent);
    const datesChanged = form.contractStart !== selected.contractStart || form.contractEnd !== selected.contractEnd;
    const paymentDayChanged = newPaymentDay !== Number(selected.paymentDay);
    const patch = { ...form, rent: newRent, deposit: Number(form.deposit) || 0, paymentDay: newPaymentDay };

    if ((datesChanged || paymentDayChanged) && form.contractStart) {
      // Прегенерира графика по новите дати/ден на плащане, но пази статуса "платено" за месеците, които вече ги е имало
      const oldByMonth = {};
      (selected.payments || []).forEach((p) => { oldByMonth[p.month] = p; });
      const fresh = generatePayments({ contractStart: form.contractStart, contractEnd: form.contractEnd, paymentDay: newPaymentDay, rent: newRent });
      patch.payments = fresh.map((p) => {
        const old = oldByMonth[p.month];
        if (old) return { ...p, id: old.id, paid: old.paid, paidDate: old.paidDate, amount: old.paid ? old.amount : newRent };
        return p;
      });
    } else if (rentChanged && selected.payments) {
      patch.payments = selected.payments.map((p) => (p.paid ? p : { ...p, amount: newRent }));
    }

    updateProperty(selected.id, patch);
    setEditing(false);
  };

  const deleteProperty = () => {
    if (!selected) return;
    const remaining = properties.filter((p) => p.id !== selected.id);
    setProperties(remaining);
    setSelectedId(null);
    setMobileView("list");
    setEditing(false);
  };

  const saveProfile = (p) => { setProfile(p); setShowProfile(false); };

  const exportBackup = () => {
    const data = { profile, properties, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `naem-i-imoti-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const resetAllData = () => {
    setProperties([]);
    setSelectedId(null);
    setShowProfile(false);
    setMobileView("list");
  };

  const togglePaid = (paymentId) => {
    if (!selected) return;
    const payments = selected.payments.map((p) => {
      if (p.id !== paymentId) return p;
      const nowUnpaid = p.paid; // ако вече беше платено, сега го връщаме на неплатено
      return {
        ...p,
        paid: !p.paid,
        paidDate: !p.paid ? new Date().toISOString().slice(0, 10) : null,
        amount: nowUnpaid ? Number(selected.rent) || p.amount : p.amount,  // при връщане към "неплатено" — взима актуалния наем
      };
    });
    updateProperty(selected.id, { payments });
  };

  const updatePaymentDetails = (paymentId, patch) => {
    if (!selected) return;
    const payments = selected.payments.map((p) => (p.id === paymentId ? { ...p, ...patch } : p));
    updateProperty(selected.id, { payments });
  };

  const addBill = (bill) => { if (selected) updateProperty(selected.id, { bills: [...(selected.bills || []), bill] }); };
  const toggleBillPaid = (billId) => {
    if (!selected) return;
    const bills = (selected.bills || []).map((b) => (b.id === billId ? { ...b, paid: !b.paid } : b));
    updateProperty(selected.id, { bills });
  };
  const updateBill = (billId, patch) => {
    if (!selected) return;
    const bills = (selected.bills || []).map((b) => (b.id === billId ? { ...b, ...patch } : b));
    updateProperty(selected.id, { bills });
  };
  const deleteBill = (billId) => {
    if (!selected) return;
    const bills = (selected.bills || []).filter((b) => b.id !== billId);
    updateProperty(selected.id, { bills });
  };
  const addMaintenance = (item) => { if (selected) updateProperty(selected.id, { maintenance: [...(selected.maintenance || []), item] }); };
  const setMaintenanceStatus = (id, status) => {
    if (!selected) return;
    const maintenance = selected.maintenance.map((m) => (m.id === id ? { ...m, status } : m));
    updateProperty(selected.id, { maintenance });
  };

  const tabs = [
    { key: "overview", label: t.tabOverview, icon: FileText },
    { key: "payments", label: t.tabPayments, icon: Calendar },
    { key: "bills", label: t.tabBills, icon: Zap },
    { key: "maintenance", label: t.tabMaintenance, icon: Wrench },
    { key: "index", label: t.tabIndex, icon: TrendingUp },
  ];

  return (
    <div>
      <div className="topbar">
        <div className="topbar-inner">
          <button onClick={() => { setSelectedId(null); setMobileView("list"); setEditing(false); setShowNew(false); }} className="brand brand-btn">
            <div className="brand-icon"><Home size={18} /></div>
            <div className="brand-text">
              <div className="brand-title truncate">{t.appTitle}</div>
              <div className="brand-subtitle">{t.appSubtitle}</div>
            </div>
          </button>
          <button onClick={() => { setShowProfile(true); pushNavState("profile"); }} className="profile-btn">
            <span className="profile-avatar">{profile.avatar || "🏠"}</span>
            <span className="profile-name truncate">{profile.name || t.profileDefault}</span>
          </button>
        </div>
      </div>

      <div className="container">
        <div className="layout-grid">
          <div className={"grid-col" + (mobileView === "detail" ? " hide-on-mobile" : "")}>
            <button onClick={() => { setShowNew(true); setEditing(false); setMobileView("list"); pushNavState("new"); }} className="btn btn-new-property">
              <Plus size={15} /> {t.newPropertyBtn}
            </button>
            {properties.map((p) => (
              <KeyTag key={p.id} property={p} active={p.id === selectedId} onClick={() => { setSelectedId(p.id); setTab("overview"); setMobileView("detail"); setShowNew(false); setEditing(false); pushNavState("detail"); }} />
            ))}
            {properties.length === 0 && !showNew && <div className="empty-hint">{t.noPropertiesYet}</div>}
            {!showNew && (
              <div className="welcome-block-mobile">
                <div className="empty-block">
                  <div className="empty-icon-wrap"><Home size={26} /></div>
                  <div className="empty-title">{t.appTitle}</div>
                  <div className="empty-desc">{t.appSubtitle}</div>
                </div>
              </div>
            )}
          </div>

          <div className={"grid-col" + (mobileView === "list" && !showNew ? " hide-on-mobile" : "")}>
            <button onClick={() => setMobileView("list")} className="back-link"><ChevronLeft size={16} /> {t.allProperties}</button>

            {!editing && selected && (
              <div>
                <div className="detail-heading">
                  <div className="detail-title">{selected.name}</div>
                  {selected.address && <div className="detail-address">{selected.address}</div>}
                </div>
                <div className="callout callout-accent rent-summary-card">
                  <div>
                    <div className="callout-label">{t.monthlyRentLabel}</div>
                    <div className="callout-amount">{fmt(selected.rent)}</div>
                    <div className="callout-sub mt-1">{t.paymentDayLabel} {selected.paymentDay}{t.ovPaymentDaySuffix}</div>
                  </div>
                </div>
                <div className="tabs">
                  {tabs.map((tb) => (<TabButton key={tb.key} active={tab === tb.key} onClick={() => setTab(tb.key)} icon={tb.icon} label={tb.label} />))}
                </div>
                {tab === "overview" && <OverviewTab key={selected.id} property={selected} onEdit={() => { setEditing(true); pushNavState("edit"); }} onDelete={deleteProperty} />}
                {tab === "payments" && <PaymentsTab property={selected} onTogglePaid={togglePaid} onUpdatePayment={updatePaymentDetails} />}
                {tab === "bills" && <BillsTab property={selected} onAddBill={addBill} onToggleBillPaid={toggleBillPaid} onUpdateBill={updateBill} onDeleteBill={deleteBill} />}
                {tab === "maintenance" && <MaintenanceTab property={selected} onAdd={addMaintenance} onStatusChange={setMaintenanceStatus} />}
                {tab === "index" && <IndexationTab property={selected} />}
              </div>
            )}

            {!selected && properties.length > 0 && (
              <div className="empty-block">
                <div className="empty-icon-wrap"><Home size={26} /></div>
                <div className="empty-title">{t.appTitle}</div>
                <div className="empty-desc">{t.appSubtitle}</div>
                <div className="empty-desc mt-1">{t.selectProperty}</div>
              </div>
            )}
            {properties.length === 0 && (
              <div className="empty-block">
                <div className="empty-icon-wrap"><Home size={22} /></div>
                <div className="empty-title">{t.addFirstPropertyTitle}</div>
                <div className="empty-desc">{t.addFirstPropertyDesc}</div>
              </div>
            )}
          </div>
        </div>

        {showNew && <PropertyForm title={t.newPropertyTitle} submitLabel={t.saveNew} onSave={addProperty} onCancel={() => setShowNew(false)} />}

        {editing && selected && (
          <PropertyForm
            title={t.editPropertyTitle(selected.name)}
            submitLabel={t.saveEdit}
            initial={{
              name: selected.name, address: selected.address, tenantName: selected.tenantName, tenantPhone: selected.tenantPhone,
              contractStart: selected.contractStart, contractEnd: selected.contractEnd, rent: selected.rent, deposit: selected.deposit,
              paymentDay: selected.paymentDay, initialElectricity: selected.initialElectricity, initialWaterHot: selected.initialWaterHot, initialWaterCold: selected.initialWaterCold,
            }}
            onSave={editProperty}
            onCancel={() => setEditing(false)}
          />
        )}

        {showProfile && (
          <ProfileModal
            profile={profile} onSave={saveProfile} onCancel={() => setShowProfile(false)}
            onExport={exportBackup} onReset={resetAllData} lang={lang}
            onLangChange={(l) => { const e = new CustomEvent("langchange", { detail: l }); window.dispatchEvent(e); }}
          />
        )}
        {saveError && <div className="toast-error">{t.saveErrorMsg}</div>}
      </div>
    </div>
  );
}

function App() {
  const [lang, setLang] = useState("bg");
  useEffect(() => {
    try {
      const savedLang = localStorage.getItem("rental-manager-lang");
      if (savedLang) setLang(savedLang);
    } catch (e) {}
    const handler = (e) => {
      setLang(e.detail);
      try { localStorage.setItem("rental-manager-lang", e.detail); } catch (err) {}
    };
    window.addEventListener("langchange", handler);
    return () => window.removeEventListener("langchange", handler);
  }, []);
  return (
    <LangContext.Provider value={lang}>
      <AppInner />
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
